[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaca-local"
version = "0.1.0"
description = "ISACA desktop and local API integration for SLiCAP 5.2.1."
requires-python = ">=3.12,<3.13"
dependencies = [
    "SLiCAP==5.2.1",
    "PySide6>=6.8,<7",
    "fastapi>=0.115,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
isaca-desktop = "isaca_desktop.__main__:main"

[project.optional-dependencies]
ui = ["gradio>=5,<6", "pandas>=2.2", "PyMuPDF>=1.25", "dashscope>=1.20"]
test = ["httpx>=0.27,<1", "pytest>=8", "pytest-qt>=4.4,<5"]
deploy = ["nuitka>=2.7", "ordered-set>=4.1", "zstandard>=0.23"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["isaca_api*", "isaca_desktop*"]
namespaces = false

[tool.setuptools.package-data]
isaca_desktop = ["resources/*.py", "resources/katex/*", "resources/katex/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
